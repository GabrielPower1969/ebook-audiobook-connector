[project]
name = "audiobook-connector"
version = "0.1.0"
description = "Align an EPUB with its audiobook and read along in the browser: click a paragraph, hear it."
requires-python = ">=3.10"
dependencies = ["mlx-whisper>=0.4"]   # Apple Silicon; transcripts are cached so it is only needed for new audio

[project.scripts]
audiobook-connector = "audiobook_connector.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["audiobook_connector*"]
[tool.setuptools.package-data]
audiobook_connector = ["app/*.html"]

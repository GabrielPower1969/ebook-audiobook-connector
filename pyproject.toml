[project]
name = "audiobook-connector"
version = "0.2.0"
description = "Read an EPUB while its audiobook plays. Click any paragraph to hear it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["epub", "audiobook", "whisper", "forced-alignment", "read-along", "immersion-reading"]
dependencies = []                       # the core (parse, align, serve) is pure standard library

[project.optional-dependencies]
cpu = ["faster-whisper>=1.0"]           # transcription anywhere (Linux/Windows/Intel Mac/Docker)
mlx = ["mlx-whisper>=0.4"]              # transcription on Apple Silicon, much faster
formats = ["pypdf>=4", "mobi>=0.3"]     # .pdf and .mobi/.azw3 input (epub needs nothing)

[project.scripts]
audiobook-connector = "audiobook_connector.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audiobook_connector*"]

[tool.setuptools.package-data]
audiobook_connector = ["app/*.html"]

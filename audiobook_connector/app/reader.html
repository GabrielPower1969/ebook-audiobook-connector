<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.ico">
<title>阅读器</title>
<!-- Single file, no build step, no external request: this page has to open on a Kindle
     experimental browser and on a Boox e-ink tablet, where a webfont fetch is a blank screen.
     Every typeface below is one the device already has. -->
<style>
:root{
  --serif:"Bookerly","Literata","Iowan Old Style","Source Serif 4","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC","Noto Serif",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --paper:#FBF9F5; --raised:#FFFFFF; --ink:#16211C; --ink-2:#46554E; --muted:#78867F;
  --line:#E5E2D9; --line-2:#EFEDE6;
  --accent:#00694B; --accent-ink:#FFFFFF; --accent-soft:#E8F3EE;
  --now:#EDF5F1; --now-s:#CFE7DC; --mark:#FBEBC0; --mark-line:#E0B94A; --word:#DCEAFB;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 12px 32px rgba(20,32,26,.10);
  --radius:10px; --speed:.16s;

  --size:19px; --lead:1.78; --measure:34em; --indent:0em; --gap:1.05em;
  --body-font:var(--serif);
}
:root[data-theme="dark"]{
  --paper:#0E1411; --raised:#151D19; --ink:#E5ECE8; --ink-2:#B0BCB6; --muted:#7F8D87;
  --line:#22302A; --line-2:#1A241F;
  --accent:#5BC79E; --accent-ink:#06120D; --accent-soft:#16241E;
  --now:#15211C; --now-s:#224234; --mark:#3E3719; --mark-line:#8A7526; --word:#1B2A3A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="eink"]){
    --paper:#0E1411; --raised:#151D19; --ink:#E5ECE8; --ink-2:#B0BCB6; --muted:#7F8D87;
    --line:#22302A; --line-2:#1A241F;
    --accent:#5BC79E; --accent-ink:#06120D; --accent-soft:#16241E;
    --now:#15211C; --now-s:#224234; --mark:#3E3719; --mark-line:#8A7526; --word:#1B2A3A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
}
/* E-ink: no grey scaffolding, no animation, no shadow. A refresh costs the reader a full
   screen flash, so nothing here may move on its own. */
:root[data-theme="eink"]{
  --paper:#FFFFFF; --raised:#FFFFFF; --ink:#000000; --ink-2:#000000; --muted:#444444;
  --line:#000000; --line-2:#AAAAAA;
  --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  --now:#F0F0F0; --now-s:#D2D2D2; --mark:#D6D6D6; --mark-line:#000000; --word:#DCDCDC;
  --shadow:none; --radius:0px; --speed:0s;
}
:root[data-theme="eink"] *{transition:none!important;animation:none!important}
:root[data-theme="eink"] .al:hover{background:none}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden;
     -webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:var(--ink-2);border-radius:var(--radius)}
button:hover{color:var(--ink);background:var(--accent-soft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}

/* ---------------------------------------------------------------- shell */
#app{display:grid;grid-template-columns:var(--rail,300px) 1fr;grid-template-rows:1fr;height:100%}
#rail{background:var(--raised);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#stage{position:relative;min-width:0;display:flex;flex-direction:column;min-height:0}

/* ---------------------------------------------------------------- rail */
#railtop{padding:12px 14px 10px;border-bottom:1px solid var(--line-2)}
#crumb{display:flex;align-items:center;gap:8px;margin-bottom:9px}
#crumb a{color:var(--muted);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:7px}
#crumb a:hover{color:var(--accent)}
.fg{width:18px;height:18px;flex:none;display:block}
:root[data-theme="dark"] .fg-light{display:none}
:root:not([data-theme="dark"]) .fg-dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="eink"]) .fg-light{display:none}
  :root:not([data-theme="light"]):not([data-theme="eink"]) .fg-dark{display:block}
}
:root[data-theme="eink"] .fg-dark{display:none!important}
:root[data-theme="eink"] .fg-light{display:block!important;filter:grayscale(1) contrast(3)}
#btitle{font:600 15.5px/1.32 var(--sans);letter-spacing:-.01em;margin:0 0 2px}
#bmeta{color:var(--muted);font-size:12.5px;margin:0}
#tabs{display:flex;gap:2px;padding:8px 10px 0}
#tabs button{flex:1;padding:7px 2px;font-size:12.5px;border-radius:8px 8px 0 0;border-bottom:2px solid transparent}
#tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.panebody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 24px;min-height:0}
.pane[hidden]{display:none}

#toc a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;
       color:var(--ink-2);text-decoration:none;cursor:pointer;line-height:1.4;font-size:13.5px}
#toc a:hover{background:var(--accent-soft);color:var(--ink)}
#toc a.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
#toc a.na{opacity:.45}
#toc .n{font:600 11px/1.6 var(--mono);color:var(--muted);min-width:1.9em;flex:none;letter-spacing:.02em}
#toc a.cur .n{color:var(--accent)}
#toc .t{flex:1}
#toc .d{color:var(--muted);font:11px/1.6 var(--mono);flex:none}

#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);
   color:var(--ink);font-size:13.5px}
#q::placeholder{color:var(--muted)}
#qhint{color:var(--muted);font-size:12px;padding:8px 10px 2px}
.hit{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.hit:hover{background:var(--accent-soft)}
.hit .c{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.hit .s{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.hit mark{background:var(--mark);color:var(--ink);padding:0 1px;border-radius:2px}

.markrow{padding:10px;border-radius:8px;border-bottom:1px solid var(--line-2);cursor:pointer}
.markrow:hover{background:var(--accent-soft)}
.markrow blockquote{margin:0 0 6px;font:italic 14px/1.6 var(--body-font);color:var(--ink);
                    border-left:3px solid var(--mark-line);padding-left:10px}
.markrow .c{color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.markrow .c button{padding:2px 7px;font-size:11.5px;color:var(--muted)}
.wordrow{display:flex;align-items:baseline;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;
         border-bottom:1px solid var(--line-2)}
.wordrow:hover{background:var(--accent-soft)}
.wordrow b{font:600 14.5px/1.4 var(--body-font);flex:1}
.wordrow .n{font:11px/1 var(--mono);color:var(--muted)}
.wordrow .x{padding:2px 7px;font-size:11.5px;color:var(--muted)}
.paneact{display:flex;gap:6px;padding:4px 4px 10px}
.paneact button{flex:1;border:1px solid var(--line);padding:7px;font-size:12.5px;border-radius:8px}
.empty{color:var(--muted);font-size:13px;padding:24px 12px;text-align:center;line-height:1.8}
.empty kbd{font:11px/1 var(--mono);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--ink-2)}

/* ---------------------------------------------------------------- text */
#main{flex:1;overflow-y:auto;overscroll-behavior-y:contain;scroll-behavior:smooth;min-height:0}
:root[data-theme="eink"] #main{scroll-behavior:auto}
#book{max-width:var(--measure);margin:0 auto;padding:6vh 24px 46vh;
      font:var(--size)/var(--lead) var(--body-font);color:var(--ink)}
#book p,#book h1,#book h2,#book h3{margin:0 0 var(--gap);padding:3px 12px;border-radius:6px;
      border-left:3px solid transparent;position:relative;
      /* skip layout and paint for paragraphs off screen: a 9,000-paragraph volume otherwise
         costs seconds on a phone and much more on an e-ink tablet */
      content-visibility:auto;contain-intrinsic-size:auto 128px}
#book p{text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:var(--indent)}
#book p+p{margin-top:calc(var(--gap) * -.15)}
#book h1{font:600 1.34em/1.3 var(--body-font);letter-spacing:-.01em;margin:2.6em 0 1.1em;
         text-align:center;text-indent:0;padding-top:.5em;content-visibility:visible}
#book h1::after{content:"";display:block;width:44px;height:2px;background:var(--accent);
         margin:.62em auto 0;opacity:.55}
#book h1:first-child{margin-top:.4em}
#book h2{font:600 1.06em/1.4 var(--body-font);margin:1.9em 0 .8em;text-indent:0;letter-spacing:.02em;
         content-visibility:visible}
#book h3{font:600 1em/1.4 var(--body-font);text-indent:0}
#book .al{cursor:pointer}
#book .al:hover{background:var(--line-2)}
#book .cur{background:var(--now);border-left-color:var(--accent)}
#book .na{color:var(--ink-2);opacity:.72}
#book .has-mark{background:var(--mark);border-left-color:var(--mark-line)}
#book .cur.has-mark{background:var(--now);border-left-color:var(--accent);box-shadow:inset 3px 0 0 var(--mark-line)}
#book .al::before{content:attr(data-t);position:absolute;left:-72px;top:.45em;width:62px;
      text-align:right;font:11.5px/1 var(--mono);color:var(--muted);opacity:0;transition:opacity var(--speed)}
#book .al:hover::before,#book .cur::before{opacity:.85}
#book i,#book em{font-style:italic}
/* sentence layer — the unit a language learner actually works with */
.sn{border-radius:3px;padding:.05em 0}
.sn.on{background:var(--now-s);box-shadow:0 0 0 1px var(--now-s)}
.sn.wq{background:var(--word)}
:root[data-theme="eink"] .sn.on{box-shadow:none;text-decoration:underline;text-underline-offset:3px}
#thread{position:absolute;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:3;
        transition:width .25s linear}

/* ---------------------------------------------------------------- bubble */
#bubble{position:absolute;z-index:40;display:none;background:var(--raised);border:1px solid var(--line);
        border-radius:999px;box-shadow:var(--shadow);padding:4px;gap:2px;align-items:center}
#bubble.on{display:flex}
#bubble button{padding:6px 13px;font-size:13.5px;border-radius:999px;white-space:nowrap}

/* ---------------------------------------------------------------- player */
#player{border-top:1px solid var(--line);background:var(--raised);
        padding:8px 16px calc(8px + env(safe-area-inset-bottom));
        display:flex;flex-direction:column;gap:6px;flex:none}
#scrub{height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#track{height:4px;width:100%;background:var(--line);border-radius:2px;position:relative}
#fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px;width:0}
#knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
      background:var(--accent);border:2px solid var(--raised);left:0}
#ctl{display:flex;align-items:center;gap:3px}
#ctl .grow{flex:1;min-width:0}
#play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:17px}
#play:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
#nowline{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#nowline b{font-weight:600;color:var(--ink)}
#clock{font:12px/1 var(--mono);color:var(--muted);white-space:nowrap;padding:0 4px}
select.mini{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 8px;font-size:12.5px}
.dot{display:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 2px 0 -4px}
.dot.on{display:inline-block}
#drill.hot{color:var(--accent-ink);background:var(--accent)}

/* ---------------------------------------------------------------- sheets */
.sheet{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--raised);border-top:1px solid var(--line);
       box-shadow:var(--shadow);padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block}
@media (min-width:820px){.sheet{inset:auto 16px 78px auto;width:430px;border:1px solid var(--line);border-radius:14px}}
.sheet h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sheet p.note{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.65}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;
     border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row>span{font-size:14px;flex:none}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:1px solid var(--line);padding:6px 11px;font-size:13px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:34px;height:32px;border:1px solid var(--line);font-size:15px}
.stepper span{min-width:3.6em;text-align:center;font:12.5px/1 var(--mono);color:var(--muted)}
#kb{color:var(--muted);font-size:12px;line-height:1.95;margin:12px 0 0}
#kb kbd{font:11px/1 var(--mono);border:1px solid var(--line);border-radius:4px;padding:2px 5px;
        background:var(--paper);color:var(--ink-2)}
#scrim{position:fixed;inset:0;z-index:50;background:rgba(10,18,14,.32);display:none}
#scrim.on{display:block}

/* ---------------------------------------------------------------- word panel */
#wordpanel{position:fixed;right:16px;bottom:78px;width:min(420px,calc(100vw - 32px));max-height:62vh;
   z-index:58;background:var(--raised);border:1px solid var(--line);border-radius:14px;
   box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#wordpanel.on{display:flex}
@media (max-width:860px){#wordpanel{right:8px;left:8px;width:auto;bottom:72px;max-height:56vh}}
#wphead{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
#wpword{font:600 21px/1.2 var(--body-font);flex:1;word-break:break-word}
#wpcount{font:11.5px/1 var(--mono);color:var(--muted);flex:none}
#wphead button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;flex:none}
#wphead button.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#wpgloss{padding:10px 16px 12px;border-bottom:1px solid var(--line-2);flex:none}
#wpgloss .ph{font:13px/1.5 var(--mono);color:var(--muted)}
#wpgloss .tr{font:15.5px/1.7 var(--body-font);color:var(--ink);margin-top:3px}
#wpgloss .en{font:13px/1.6 var(--sans);color:var(--ink-2);margin-top:4px}
#wpgloss .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
#wpgloss .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);
      color:var(--accent);font-weight:600;letter-spacing:.02em}
#wpgloss .frq{font:11px/1 var(--mono);color:var(--muted)}
#wpgloss .out{margin-left:auto;font-size:11.5px}
#wpgloss .out a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
#wpgloss .out a:hover{color:var(--accent)}
#wpgloss.none{color:var(--muted);font-size:13px}
.wordrow .tr{flex-basis:100%;font:12.5px/1.5 var(--sans);color:var(--muted);margin-top:2px}
.wordrow{flex-wrap:wrap}
#wpbody{overflow-y:auto;padding:6px 8px 12px}
.wpline{padding:9px 10px;border-radius:8px;cursor:pointer;font:14px/1.6 var(--body-font);
        color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.wpline:hover{background:var(--accent-soft);color:var(--ink)}
.wpline b{color:var(--ink);background:var(--word);border-radius:2px;padding:0 2px}
.wpline .c{display:block;font:10.5px/1.6 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* ---------------------------------------------------------------- toast / resume */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:var(--ink);
       color:var(--paper);padding:9px 18px;border-radius:999px;font-size:13.5px;opacity:0;
       pointer-events:none;transition:opacity var(--speed);max-width:80vw;text-align:center}
#toast.on{opacity:.95}
#resume{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:20;background:var(--raised);
        border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:7px 8px 7px 16px;
        display:none;align-items:center;gap:10px;font-size:13.5px;max-width:calc(100% - 24px);white-space:nowrap}
#resume.on{display:flex}
#resume .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
#resume b{font-weight:600}
#resume button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
#resume .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

#railbtn{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:55;transform:translateX(-102%);
        transition:transform var(--speed);box-shadow:var(--shadow)}
  #rail.on{transform:none}
  #railbtn{display:inline-flex}
  #book{padding:3vh 6px 40vh}
  #book p,#book h1,#book h2{padding-left:10px;padding-right:10px}
  #book p{text-align:left}          /* justified text in a phone-width column opens rivers */
  #book .al::before{display:none}
  /* on a phone the speed control earns its place and the clock does not: slowing the narration
     down is the first thing a language learner reaches for */
  #clock,#nowline{display:none}
  #ctl{gap:0}
  .ico{width:38px}
  #resume{top:8px;padding:6px 6px 6px 12px;font-size:12.5px;gap:6px}
  #resume button{padding:5px 10px;font-size:12.5px}
}
@media (max-width:430px){
  /* Ten controls do not fit a phone. The ±5 s buttons go first: for a learner, stepping by
     sentence is better navigation than stepping by seconds, and the scrubber still seeks. */
  #back5,#fwd5{display:none}
  .ico{width:36px}
}
</style></head>
<body>
<div id="app">

 <aside id="rail">
  <div id="railtop">
   <div id="crumb"><a href="index.html">
     <img class="fg fg-light" src="flowgt.svg" alt="FlowGT"><img class="fg fg-dark" src="flowgt-reverse.svg" alt="">
     ‹ 书架</a></div>
   <h1 id="btitle"></h1>
   <p id="bmeta"></p>
  </div>
  <div id="tabs" role="tablist">
   <button id="tabToc"  role="tab" aria-selected="true"  aria-controls="toc">目录</button>
   <button id="tabFind" role="tab" aria-selected="false" aria-controls="find">搜索</button>
   <button id="tabMark" role="tab" aria-selected="false" aria-controls="marks">收藏</button>
   <button id="tabWord" role="tab" aria-selected="false" aria-controls="words">生词</button>
  </div>
  <nav  id="toc"   class="pane panebody" role="tabpanel"></nav>
  <div  id="find"  class="pane panebody" role="tabpanel" hidden>
    <input id="q" type="search" placeholder="搜索全书…" autocomplete="off" spellcheck="false">
    <div id="qhint"></div><div id="qout"></div>
  </div>
  <div  id="marks" class="pane panebody" role="tabpanel" hidden></div>
  <div  id="words" class="pane panebody" role="tabpanel" hidden></div>
 </aside>

 <div id="stage">
  <div id="thread"></div>
  <div id="resume"></div>
  <div id="main"><article id="book"></article></div>
  <div id="bubble">
   <button id="bMark">收藏</button><button id="bWord">查词</button><button id="bPlay">朗读此处</button>
  </div>

  <div id="player">
   <div id="scrub"><div id="track"><div id="fill"></div><div id="knob"></div></div></div>
   <div id="ctl">
    <button class="ico" id="railbtn" title="目录 (T)">☰</button>
    <button class="ico" id="prevs" title="上一句 (K)">‹</button>
    <button class="ico" id="back5" title="后退 5 秒 (←)">↺</button>
    <button id="play" title="播放 / 暂停 (空格)">▶</button>
    <button class="ico" id="fwd5" title="前进 5 秒 (→)">↻</button>
    <button class="ico" id="nexts" title="下一句 (J)">›</button>
    <button class="ico" id="again" title="重听这一句 (R)">⟲</button>

<script>
"use strict";
var $=function(s){return document.querySelector(s)};
var au=$('#au'), book=$('#book'), main=$('#main'), rail=$('#rail'), toc=$('#toc');
// The browser restores the scroll offset of #main on reload, asynchronously, and lands wherever
// the previous visit happened to be — overriding the reading position we are about to set.
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}

/* Two ways to run. Served by `audiobook-connector serve`, the library is the web root and the
   JSON is fetched. Opened straight off a disk — the portable copy, double-clicked — `fetch` is
   blocked on file:// by every browser, but a <script> tag is not: the same data is written beside
   it as .js assigning a global, and the library sits one folder down. localStorage still works, so
   reading position and vocabulary survive; only the shared-across-devices part needs the server. */
var FILE = location.protocol === 'file:';
var ROOT = FILE ? 'library/' : '';
function loadData(path, name){
  if(!FILE) return fetch(ROOT+path+'.json').then(function(r){ if(!r.ok) throw new Error(path); return r.json(); });
  return new Promise(function(res, rej){
    var s=document.createElement('script');
    s.src=ROOT+path+'.js';
    s.onload=function(){ res(window[name]); };
    s.onerror=function(){ rej(new Error(s.src)); };
    document.head.appendChild(s);
  });
}
function api(path, dflt){
  if(FILE) return Promise.resolve(dflt);
  return fetch(path).then(function(r){ return r.ok?r.json():dflt; }).catch(function(){ return dflt; });
}

var SLUG=new URLSearchParams(location.search).get('book')||'';
var BASE=ROOT+SLUG+'/', PKEY='ac:pos:'+SLUG, MKEY='ac:marks:'+SLUG, PREFKEY='ac:prefs';
var D=null, SEQ=[], CH=[], curId=-1, curFile=-1, ME={user:'local',auth:'local'};
var marks=[], marksDirty=false, lastSave=0, restoring=false;
var curSent=null;                       // {id, i, s, e}

function fmt(s){ s=Math.max(0,Math.floor(s||0));
  var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(x).padStart(2,'0'); }
function hms(s){ var h=Math.floor((s||0)/3600), m=Math.round((s||0)%3600/60);
  return h ? (h+' 小时'+(m?' '+m+' 分':'')) : (m+' 分'); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function toast(t){ var el=$('#toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('on')},2000); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function txt(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent.trim(); }

/* ---------------------------------------------------------------- preferences */
var P=Object.assign({theme:'auto', font:'serif', size:(screen.width<600?17:19), lead:1.78,
                     wide:34, indent:0, follow:1, sleep:0, rate:1,
                     sent:1, loop:'off', times:2, gap:0}, lsGet(PREFKEY,{}));
function applyPrefs(){
  var r=document.documentElement.style;
  if(P.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',P.theme);
  r.setProperty('--body-font', P.font==='sans'?'var(--sans)':'var(--serif)');
  r.setProperty('--size', P.size+'px');
  r.setProperty('--lead', String(P.lead));
  r.setProperty('--measure', P.wide+'em');
  r.setProperty('--indent', P.indent+'em');
  $('#drill').classList.toggle('hot', P.loop!=='off' || +P.gap!==0);
  $('#drilldot').classList.toggle('on', P.loop!=='off' || +P.gap!==0);
  syncSheet();
}
function syncSheet(){
  function seg(id,val){ var b=$(id).children, i;
    for(i=0;i<b.length;i++) b[i].setAttribute('aria-pressed', String(b[i].dataset.v===String(val))); }
  seg('#segTheme',P.theme); seg('#segFont',P.font); seg('#segIndent',P.indent);
  seg('#segFollow',P.follow); seg('#segSleep',P.sleep);
  seg('#segSent',P.sent); seg('#segLoop',P.loop); seg('#segTimes',P.times); seg('#segGap',P.gap);
  $('#stpSize').children[1].textContent=P.size+'px';
  $('#stpLead').children[1].textContent=P.lead.toFixed(2);
  $('#stpWide').children[1].textContent=P.wide+'em';
}
function savePrefs(){ lsSet(PREFKEY,P); applyPrefs(); }
applyPrefs();

/* ---------------------------------------------------------------- load */
Promise.all([
  loadData(SLUG+'/data', '__AC_BOOK'),
  api('api/me', ME),
  api('api/progress/'+encodeURIComponent(SLUG), {}),
  api('api/marks/'+encodeURIComponent(SLUG), [])
]).then(function(a){
  D=a[0]; ME=a[1];
  document.title=D.title;
  marks=mergeMarks(lsGet(MKEY,[]), Array.isArray(a[3])?a[3]:[]);
  render();
  restore(a[2]&&a[2].ts?a[2]:null);
}).catch(function(){
  book.innerHTML='<p class="na">打不开这本书。回到 <a href="index.html">书架</a> 看看。</p>';
});

/* ---------------------------------------------------------------- render */
function render(){
  $('#btitle').textContent=D.title;
  var bits=[];
  if(D.author) bits.push(D.author);
  if(D.narrator) bits.push('朗读 '+D.narrator);
  var secs=(D.durations||[]).reduce(function(x,y){return x+y},0);
  if(secs) bits.push(hms(secs));
  $('#bmeta').textContent=bits.join(' · ');

  // Which heading level is the chapter level? h1 when the book really has chapters — that is what
  // mark_chapters() produces from the audio file names. A book split into "Part 01…Part 08" has
  // only its own h2 headings, and a single-entry table of contents is worse than a noisy one.
  var TOP='h1', i, k, tag;
  for(var lv=0; lv<3; lv++){
    tag=['h1','h2','h3'][lv]; k=0;
    for(i=0;i<D.paras.length;i++) if(D.paras[i].tag===tag) k++;
    if(k>=3){ TOP=tag; break; }
  }

  var frag=document.createDocumentFragment(), p, el;
  for(i=0;i<D.paras.length;i++){
    p=D.paras[i];
    el=document.createElement(p.tag==='h1'?'h1':p.tag==='h2'?'h2':p.tag==='h3'?'h3':'p');
    el.innerHTML=p.html; el.id='p'+p.id;
    if(p.t){ el.className='al'; el.dataset.t=fmt(p.t.s); }
    else el.className='na';
    frag.appendChild(el);
    if(p.tag===TOP) CH.push({id:p.id, title:txt(p.html), t:p.t});
  }
  book.appendChild(frag);
  if(!CH.length) CH.push({id:0,title:D.title,t:D.paras[0]&&D.paras[0].t});

  SEQ=D.paras.filter(function(p){return p.t}).sort(function(x,y){
    return x.t.f-y.t.f || x.t.s-y.t.s || x.id-y.id; });

  chapterSpans(); buildToc(); paintMarks(); renderMarks(); renderWords();
  book.addEventListener('click', onBookClick);
  book.addEventListener('dblclick', onBookDblClick);
  main.addEventListener('scroll', onScroll, {passive:true});
  wrapNear(); setTimeout(wrapNear, 400);
}

/* How long each chapter actually runs, and which paragraph to play for a chapter whose own
   heading never anchored (one short line does not always find an anchor). */
function chapterSpans(){
  var dur=D.durations||[], i, c, nx;
  for(i=0;i<CH.length;i++){
    c=CH[i];
    if(c.t) continue;
    var end=(i+1<CH.length)?CH[i+1].id:D.paras.length;
    for(var k=c.id+1;k<end;k++) if(D.paras[k].t){ c.t=D.paras[k].t; c.playId=k; break; }
  }
  for(i=0;i<CH.length;i++){
    c=CH[i]; if(!c.t){ c.len=0; continue; }
    nx=null;
    for(var j=i+1;j<CH.length;j++) if(CH[j].t){ nx=CH[j].t; break; }
    c.len = (nx && nx.f===c.t.f) ? Math.max(0, nx.s-c.t.s) : Math.max(0, (dur[c.t.f]||0) - c.t.s);
  }
}
function chapterPlayId(c){ return (c && typeof c.playId==='number') ? c.playId : (c?c.id:0); }

function buildToc(){
  toc.innerHTML='';
  for(var i=0;i<CH.length;i++){
    var c=CH[i], a=document.createElement('a');
    a.className=c.t?'':'na'; a.dataset.ch=String(i); a.href='#p'+c.id;
    a.innerHTML='<span class="n">'+(i+1)+'</span><span class="t"></span>'+
                (c.len?'<span class="d">'+fmt(c.len)+'</span>':'');
    a.querySelector('.t').textContent=nicecase(c.title);
    a.onclick=function(e){ e.preventDefault(); jumpTo(CH[+this.dataset.ch].id); closeRail(); };
    toc.appendChild(a);
  }
}
/* Chapter titles come out of a PDF in caps. Caps read slower and shout in a list. */
function nicecase(s){
  if(!/[a-z]/.test(s) && /[A-Z]/.test(s)){
    var small={a:1,an:1,and:1,the:1,of:1,in:1,on:1,at:1,to:1,for:1,from:1,with:1,or:1,nor:1,but:1};
    return s.toLowerCase().replace(/[^\s-]+/g,function(w,i){
      return (i>0 && small[w]) ? w : w.charAt(0).toUpperCase()+w.slice(1); });
  }
  return s;
}

/* ------------------------------------------------- sentence spans, wrapped lazily
   A 9,000-paragraph book would gain ~35,000 extra elements if every sentence were wrapped up
   front. Wrap a paragraph the first time it comes near the viewport, or the moment playback
   needs to highlight inside it. */
function wrapSentences(el, sent){
  if(!sent || el.dataset.w) return;
  el.dataset.w='1';
  var nodes=[], w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  while(w.nextNode()) nodes.push(w.currentNode);
  var pos=0;
  for(var n=0;n<nodes.length;n++){
    var node=nodes[n], t=node.nodeValue, a=pos, b=pos+t.length; pos=b;
    var parts=[];
    for(var r=0;r<sent.length;r++){
      var s=Math.max(a,sent[r][0]), e=Math.min(b,sent[r][1]);
      if(s<e) parts.push([s-a, e-a, r]);
    }
    if(!parts.length) continue;
    var frag=document.createDocumentFragment(), cur=0;
    for(var q=0;q<parts.length;q++){
      if(parts[q][0]>cur) frag.appendChild(document.createTextNode(t.slice(cur,parts[q][0])));
      var sp=document.createElement('span');
      sp.className='sn'; sp.dataset.i=parts[q][2];
      sp.textContent=t.slice(parts[q][0],parts[q][1]);
      frag.appendChild(sp); cur=parts[q][1];
    }
    if(cur<t.length) frag.appendChild(document.createTextNode(t.slice(cur)));
    node.parentNode.replaceChild(frag,node);
  }
}
function ensureWrapped(id){
  if(!+P.sent) return;
  var p=D.paras[id], el=document.getElementById('p'+id);
  if(p && el && p.t && p.t.sent) wrapSentences(el, p.t.sent);
}
/* Wrap the band of paragraphs around the current scroll position. Driven by scroll rather than
   IntersectionObserver: an observer rooted on a scroller never fires while the tab is hidden or
   the pane is collapsed, and then the sentence layer silently never appears. A binary search plus
   a short walk is cheap enough to run on every scroll frame. */
function paraAt(y){
  var lo=0, hi=D.paras.length-1, ans=0, el;
  while(lo<=hi){ var m=(lo+hi)>>1; el=document.getElementById('p'+m);
    if(!el) break;
    if(el.offsetTop<=y){ ans=m; lo=m+1; } else hi=m-1; }
  return ans;
}
function wrapNear(){
  if(!D || !+P.sent) return;
  var h=main.clientHeight, i, n=0, el;
  if(!h){
    // No layout yet — a background tab, or a pane that has not been shown. Every offsetTop reads
    // 0, so a scroll-position search would land at the end of the book; work from the cursor.
    for(i=Math.max(0,curId); i<D.paras.length && n<40; i++){
      el=document.getElementById('p'+i);
      if(el && !el.dataset.w){ ensureWrapped(i); n++; }
    }
    return;
  }
  var top=Math.max(0, main.scrollTop-h), bot=main.scrollTop+2*h;
  for(i=paraAt(top); i<D.paras.length && n<80; i++){
    el=document.getElementById('p'+i);
    if(!el) break;
    if(el.offsetTop>bot) break;
    if(!el.dataset.w){ ensureWrapped(i); n++; }
  }
}
function scheduleWrap(){
  if(scheduleWrap._t) return;
  scheduleWrap._t=requestAnimationFrame(function(){ scheduleWrap._t=0; wrapNear(); });
}
function sentAt(id, t){
  var p=D.paras[id]; if(!p||!p.t||!p.t.sent) return null;
  var a=p.t.sent, lo=0, hi=a.length-1, ans=-1;
  while(lo<=hi){ var m=(lo+hi)>>1; if(a[m][2]<=t+0.05){ ans=m; lo=m+1; } else hi=m-1; }
  if(ans<0) return null;
  var e=a[ans][3] || (ans+1<a.length ? a[ans+1][2] : p.t.e);
  return {id:id, i:ans, s:a[ans][2], e:e};
}
function markSentence(s){
  var old=book.querySelectorAll('.sn.on'), i;
  for(i=0;i<old.length;i++) old[i].classList.remove('on');
  curSent=s; paraDone=false;
  if(!s) return;
  if(!+P.sent) return;
  ensureWrapped(s.id);
  var el=document.getElementById('p'+s.id);
  if(!el) return;
  var sp=el.querySelectorAll('.sn[data-i="'+s.i+'"]');
  for(i=0;i<sp.length;i++) sp[i].classList.add('on');
}

/* ---------------------------------------------------------------- playback */
function onBookClick(e){
  if(e.detail>1 || String(window.getSelection())) return;   // a double click selects a word
  var sn=e.target.closest ? e.target.closest('.sn') : null;
  if(sn && book.contains(sn)){
    var pid=+sn.closest('.al').id.slice(1), i=+sn.dataset.i, a=D.paras[pid].t.sent[i];
    setCur(pid); seek(D.paras[pid].t.f, a[2], true);
    markSentence({id:pid,i:i,s:a[2],e:a[3]||(D.paras[pid].t.sent[i+1]?D.paras[pid].t.sent[i+1][2]:D.paras[pid].t.e)});
    loopLeft=+P.times; return;
  }
  var el=e.target.closest ? e.target.closest('.al') : null;
  if(el && book.contains(el)) playPara(+el.id.slice(1), true);
}
function playPara(id, play){
  var p=D.paras[id]; if(!p||!p.t) return;
  seek(p.t.f, p.t.s, play); setCur(id);
  markSentence(sentAt(id, p.t.s));
  loopLeft=+P.times;
}
function seek(f,t,play){
  var go=function(){ try{ au.currentTime=t; }catch(e){} if(play) au.play().catch(function(){}); };
  if(curFile!==f || !au.src){
    curFile=f; au.src=BASE+'audio/'+encodeURIComponent(D.files[f]);
    au.playbackRate=+$('#rate').value;
    au.addEventListener('loadedmetadata', go, {once:true});
    au.load();
  } else go();
}
function setCur(id){
  if(id===curId) return;
  var old=book.querySelector('.cur'); if(old) old.classList.remove('cur');
  curId=id;
  var el=document.getElementById('p'+id);
  if(el){ el.classList.add('cur'); ensureWrapped(id); if(!restoring) follow(el); }
  var ci=chapterOf(id), links=toc.children, i;
  for(i=0;i<links.length;i++) links[i].classList.toggle('cur', i===ci);
  var ch=CH[ci];
  $('#nowline').innerHTML='<b>'+esc(nicecase(ch?ch.title:D.title))+'</b>';
  media(ch);
}
function chapterOf(id){ var i, k=0; for(i=0;i<CH.length;i++){ if(CH[i].id<=id) k=i; else break; } return k; }
function follow(el){
  if(!+P.follow) return;
  var r=el.getBoundingClientRect(), h=main.clientHeight, top=main.getBoundingClientRect().top;
  if(r.top-top < h*0.14 || r.bottom-top > h*0.72) main.scrollTop = el.offsetTop - h*0.34;
}
function jumpTo(id){
  var el=document.getElementById('p'+id); if(!el) return;
  ensureWrapped(id);
  main.scrollTop = el.offsetTop - main.clientHeight*0.18;
  wrapNear();
  if(D.paras[id] && D.paras[id].t) setCur(id);
}
function locate(f,t){
  var lo=0, hi=SEQ.length-1, ans=-1, m, p;
  while(lo<=hi){ m=(lo+hi)>>1; p=SEQ[m].t;
    if(p.f<f || (p.f===f && p.s<=t)){ ans=m; lo=m+1; } else hi=m-1; }
  return (ans>=0 && SEQ[ans].t.f===f) ? SEQ[ans] : null;
}

/* --------------------------------------------------- repeat and shadowing
   The loop is what turns a read-along into practice: hear one sentence, pause, say it back,
   hear it again. Everything below is driven from timeupdate so it survives seeking. */
var loopLeft=0, gapTimer=0, paraDone=false;
function gapMs(s){ var g=+P.gap; return g<0 ? Math.round((s||2)*1000) : g*1000; }
/* Returns true when it took charge of playback. `clear` un-marks the unit as finished, and is
   called just before rewinding — otherwise the second pass would sail past its own end. */
function afterUnit(unitStart, dur, clear){
  if(P.loop!=='off' && loopLeft>1){
    loopLeft--;
    pauseThen(function(){ clear(); au.currentTime=unitStart; au.play().catch(function(){}); }, gapMs(dur));
    return true;
  }
  if(P.loop!=='off') loopLeft=+P.times;
  if(+P.gap!==0){ pauseThen(function(){ au.play().catch(function(){}); }, gapMs(dur)); return true; }
  return false;
}
function pauseThen(fn, ms){
  au.pause(); clearTimeout(gapTimer);
  if(ms<=0){ fn(); return; }
  $('#nowline').innerHTML='<b>跟读…</b>';
  gapTimer=setTimeout(function(){ fn(); if(curId>=0) setNowline(); }, ms);
}
function setNowline(){ var ch=CH[chapterOf(curId)];

au.addEventListener('timeupdate', function(){
  if(!D || curFile<0) return;
  var t=au.currentTime;

  // The unit is "done" once its end has been acted on, so that resuming after a shadowing pause
  // lands past the end without immediately pausing again.
  if(curSent && !curSent.done && (P.loop==='sent' || +P.gap!==0)){
    if(curSent.e && t >= curSent.e - 0.02 && !au.paused){
      var u=curSent; u.done=true;
      if(afterUnit(u.s, u.e-u.s, function(){ u.done=false; })) return;
    }
  }
  if(P.loop==='para' && curId>=0 && !paraDone){
    var pp=D.paras[curId].t;
    if(pp && pp.e && t >= pp.e - 0.02 && !au.paused){
      paraDone=true;
      if(afterUnit(pp.s, pp.e-pp.s, function(){ paraDone=false; })) return;
    }
  }

  var p=locate(curFile, t);
  if(p){
    setCur(p.id);
    var s=sentAt(p.id, t);
    if(s && (!curSent || curSent.id!==s.id || curSent.i!==s.i)) markSentence(s);
  }
  var d=au.duration||0, pct=d?t/d*100:0;
  $('#fill').style.width=pct+'%'; $('#knob').style.left=pct+'%';
  $('#clock').textContent=fmt(t)+' / '+fmt(d);
  $('#thread').style.width=(curId/Math.max(1,D.paras.length-1)*100)+'%';
  savePos(false);
  if(sleepAt && Date.now()>sleepAt) stopSleep(true);
});

function stepSent(k){
  var id=curId, p=D.paras[id];
  if(p && p.t && p.t.sent && curSent){
    var i=curSent.i+k;
    if(i>=0 && i<p.t.sent.length){

  var j=-1;
  for(var n=0;n<SEQ.length;n++) if(SEQ[n].id===curId){ j=n; break; }

/* Chrome restores the scroll offset of a nested scroller after the content grows tall enough,
   which lands some time after load and overrides the position we just restored.
   `scrollRestoration` does not cover nested scrollers, so hold our target until it stops
   fighting or the reader touches anything — whichever comes first. */
function holdScroll(target, done){
  var stop=false, t0=Date.now(), prev=main.style.scrollBehavior;
  main.style.scrollBehavior='auto'; target=Math.max(0,target);
  function release(){
    if(stop) return; stop=true;
    main.removeEventListener('scroll', watch);
    ['wheel','touchstart','keydown','pointerdown'].forEach(function(e){ window.removeEventListener(e, release, true); });
    main.style.scrollBehavior=prev; if(done) done();
  }
  function watch(){
    if(stop) return;
    if(Math.abs(main.scrollTop-target)>4) main.scrollTop=target;
    if(Date.now()-t0>2500) release();
  }
  main.scrollTop=target;
  main.addEventListener('scroll', watch);
  ['wheel','touchstart','keydown','pointerdown'].forEach(function(e){ window.addEventListener(e, release, true); });
  requestAnimationFrame(watch); setTimeout(release, 2600);
}
function restore(server){
  var local=lsGet(PKEY,null), s=local;
  if(server && (!local || (server.ts||0)*1000 > (local.ts||0))) s=server;
  if(!s || typeof s.id!=='number'){ setCur(SEQ.length?SEQ[0].id:0); return; }
  restoring=true;
  seek(s.f, s.t||0, false); setCur(s.id); markSentence(sentAt(s.id, s.t||0));
  var el=document.getElementById('p'+s.id);
  if(el) holdScroll(el.offsetTop-main.clientHeight*0.3, function(){ restoring=false; });
  else restoring=false;
  var ch=CH[chapterOf(s.id)], r=$('#resume');
  r.innerHTML='<span class="lbl">上次读到 <b></b></span>'+
    '<button class="go">继续朗读</button><button class="x">从头</button>';
  r.querySelector('b').textContent=nicecase(ch?ch.title:'') + (s.t?(' · '+fmt(s.t)):'');
  r.classList.add('on');
  r.querySelector('.go').onclick=function(){ r.classList.remove('on'); au.play().catch(function(){}); };
  r.querySelector('.x').onclick=function(){ r.classList.remove('on');
    var f=SEQ.length?SEQ[0].id:0; playPara(f,false); jumpTo(f); };
  setTimeout(function(){ r.classList.remove('on'); }, 14000);
}
function onScroll(){
  if(!D) return;
  var y=main.scrollTop+main.clientHeight*0.3, lo=0, hi=D.paras.length-1, id=0, el;
  while(lo<=hi){ var m=(lo+hi)>>1; el=document.getElementById('p'+m);
    if(!el) break;
    if(el.offsetTop<=y){ id=m; lo=m+1; } else hi=m-1; }
  $('#thread').style.width=(id/Math.max(1,D.paras.length-1)*100)+'%';
  var ci=chapterOf(id), links=toc.children, i;

  scheduleWrap();
}

/* ---------------------------------------------------------------- saved passages & words */
function mergeMarks(a,b){
  var by={}, i;
  for(i=0;i<a.length;i++) if(a[i]&&a[i].k) by[a[i].k]=a[i];
  for(i=0;i<b.length;i++) if(b[i]&&b[i].k && (!by[b[i].k] || (b[i].ts||0)>(by[b[i].k].ts||0))) by[b[i].k]=b[i];
  var out=[]; for(var k in by) if(by[k].text) out.push(by[k]);
  out.sort(function(x,y){ return x.id-y.id; });
  return out;
}
function addMark(id, text, kind){
  text=(text||'').replace(/\s+/g,' ').trim();
  if(!text) return;
  kind=kind||'passage';
  var k=kind+':'+(kind==='word'?text.toLowerCase():id+':'+text.slice(0,40));
  for(var i=0;i<marks.length;i++) if(marks[i].k===k){ toast(kind==='word'?'这个词已经在生词本里':'这句已经在收藏里'); return; }
  marks.push({k:k, id:id, kind:kind, text:text, note:'', ts:Date.now()});
  marks.sort(function(x,y){return x.id-y.id});
  persistMarks(); paintMarks(); renderMarks(); renderWords();
  toast(kind==='word'?'已加入生词本':'已收藏');
}
function dropMark(k){
  marks=marks.filter(function(m){return m.k!==k});
  persistMarks(); paintMarks(); renderMarks(); renderWords(); toast('已移除');
}
function persistMarks(){ lsSet(MKEY, marks); marksDirty=true; pushMarks(false); }
function pushMarks(force){
  if(FILE || !marksDirty || ME.auth==='local') return;
  if(!force && pushMarks._t) return;
  clearTimeout(pushMarks._t);
  var send=function(){
    marksDirty=false; pushMarks._t=null;
    var body=JSON.stringify({items:marks}), url='api/marks/'+encodeURIComponent(SLUG);
    if(force && navigator.sendBeacon) navigator.sendBeacon(url, new Blob([body],{type:'application/json'}));
    else fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(function(){});
  };
  if(force) send(); else pushMarks._t=setTimeout(send, 2500);
}
function passages(){ return marks.filter(function(m){ return (m.kind||'passage')!=='word'; }); }
function vocab(){ return marks.filter(function(m){ return m.kind==='word'; }); }
function paintMarks(){

function renderWords(){

function exportWords(){
  var ws=vocab();
  if(!ws.length) return;
  // word / gloss / a real sentence from the book / where it came from — an Anki row
  var lines=ws.map(function(m){
    var occ=wordIndex()[normWord(m.text)];
    var ex=occ&&occ.length ? sentenceText(occ[0]) : '';
    var g=glossOf(m.text);
    return [m.text, g?g.t:'', ex.replace(/\t/g,' '), D.title].join('\t');
  });
  var blob=lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(blob).then(
    function(){ toast(ws.length+' 个生词已复制到剪贴板'); },
    function(){ fallbackCopy(blob, ws.length); });
  else fallbackCopy(blob, ws.length);
}
function fallbackCopy(text, n){
  var ta=document.createElement('textarea'); ta.value=text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(n+' 个生词已复制到剪贴板'); }
  catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* ---------------------------------------------------------------- word lookup
   No dictionary ships with this page — it would be a megabyte of data and a licence problem, and
   every phone and e-reader already has one behind a long press. What a dictionary cannot give you
   is this book: how often the word occurs here and every sentence it occurs in. That is the part
   worth building, and it is also what makes a word stick. */
var WIDX=null, PLAIN=null;
function plainOf(id){
  if(!PLAIN) PLAIN={};
  if(PLAIN[id]===undefined) PLAIN[id]=txt(D.paras[id].html);
  return PLAIN[id];
}
function normWord(w){ return String(w).toLowerCase().replace(/[’]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,''); }
function wordIndex(){
  if(WIDX) return WIDX;
  WIDX={};
  var re=/[A-Za-z][A-Za-z'’-]*/g;
  for(var i=0;i<D.paras.length;i++){
    var t=plainOf(D.paras[i].id), m;
    re.lastIndex=0;
    while((m=re.exec(t))){
      var w=normWord(m[0]); if(w.length<2) continue;
      (WIDX[w] || (WIDX[w]=[])).push([D.paras[i].id, m.index]);
    }
  }
  return WIDX;
}
function wordCount(w){ var a=wordIndex()[normWord(w)]; return a?a.length:0; }
function sentenceText(occ){
  var id=occ[0], at=occ[1], t=plainOf(id), p=D.paras[id];
  if(p.t && p.t.sent){
    for(var i=0;i<p.t.sent.length;i++)
      if(at>=p.t.sent[i][0] && at<p.t.sent[i][1]) return t.slice(p.t.sent[i][0], p.t.sent[i][1]).trim();
  }
  var a=Math.max(0,at-90), b=Math.min(t.length, at+120);
  return (a?'…':'')+t.slice(a,b).trim()+(b<t.length?'…':'');
}
/* The dictionary is a few megabytes built from ECDICT for exactly the words this library uses
   (scripts/build-dict.py). It is fetched once, on the first lookup, and never before — a reader
   who only listens never pays for it. */
var DICT=null, DICTP=null;
function loadDict(){
  if(DICT) return Promise.resolve(DICT);
  if(!DICTP) DICTP=loadData('_dict/dict', '__AC_DICT')
    .then(function(d){ DICT=d; return d; })
    .catch(function(){ DICT={w:{},e:[],missing:1}; return DICT; });
  return DICTP;
}
var TAGNAME={zk:'中考', gk:'高考', cet4:'四级', cet6:'六级', ky:'考研',
             toefl:'托福', ielts:'雅思', gre:'GRE'};
function renderGloss(w){
  var box=$('#wpgloss');
  if(!DICT){ box.className='none'; box.textContent='正在载入词典…'; return; }
  var i=DICT.w?DICT.w[w]:undefined, e=(i===undefined)?null:DICT.e[i];
  var out='<span class="out">'+
    '<a target="_blank" rel="noopener" href="https://dict.youdao.com/result?word='+encodeURIComponent(w)+'&lang=en">有道</a> · '+
    '<a target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english-chinese-simplified/'+encodeURIComponent(w)+'">剑桥</a></span>';
  if(!e){
    box.className='none';
    box.innerHTML='<div class="tags">'+(DICT.missing?'词典未生成':'词典里没有这个词')+out+'</div>';
    return;
  }
  box.className='';
  var tags=(e.g||'').split(' ').filter(Boolean).map(function(t){
    return '<span class="tag">'+(TAGNAME[t]||t)+'</span>'; }).join('');
  if(e.c) tags+='<span class="tag">柯林斯 '+'★'.repeat(e.c)+'</span>';
  var frq=e.f?'<span class="frq">词频 #'+e.f+'</span>':'';
  box.innerHTML=(e.p?'<div class="ph">/'+esc(e.p)+'/</div>':'')+
    '<div class="tr">'+esc(e.t)+'</div>'+
    (e.d?'<div class="en">'+esc(e.d)+'</div>':'')+
    '<div class="tags">'+tags+frq+out+'</div>';
}
function glossOf(w){
  if(!DICT || !DICT.w) return null;
  var i=DICT.w[normWord(w)];
  return i===undefined ? null : DICT.e[i];
}

function showWord(w){
  w=normWord(w);
  if(!w){ return; }
  var occ=wordIndex()[w] || [];
  renderGloss(w);
  loadDict().then(function(){ if($('#wpword').textContent===w) renderGloss(w); });
  $('#wpword').textContent=w;
  $('#wpcount').textContent=occ.length ? ('全书 '+occ.length+' 处') : '全书未出现';
  var saved=vocab().some(function(m){ return normWord(m.text)===w; });
  var b=$('#wpsave');
  b.textContent=saved?'已在生词本':'加入生词本';
  b.classList.toggle('hot', saved);
  b.onclick=function(){
    if(saved){ var m=vocab().filter(function(x){return normWord(x.text)===w})[0];
               if(m) dropMark(m.k); showWord(w); return; }
    addMark(curId>=0?curId:(occ[0]?occ[0][0]:0), w, 'word'); showWord(w);
  };
  var h='', n=Math.min(occ.length, 60);
  for(var i=0;i<n;i++){
    var s=sentenceText(occ[i]);
    var re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','ig');
    h+='<div class="wpline" data-id="'+occ[i][0]+'" data-at="'+occ[i][1]+'">'+
       '<span class="c">'+esc(nicecase(CH[chapterOf(occ[i][0])]?CH[chapterOf(occ[i][0])].title:''))+'</span>'+
       esc(s).replace(re,'<b>$1</b>')+'</div>';
  }
  if(occ.length>n) h+='<p class="empty">还有 '+(occ.length-n)+' 处未列出</p>';
  $('#wpbody').innerHTML=h||'<p class="empty">这个词不在本书里。</p>';
  $('#wpbody').onclick=function(e){
    var row=e.target.closest('.wpline'); if(!row) return;
    var id=+row.dataset.id, at=+row.dataset.at, p=D.paras[id];
    jumpTo(id);
    if(p.t && p.t.sent){
      for(var i=0;i<p.t.sent.length;i++) if(at>=p.t.sent[i][0] && at<p.t.sent[i][1]){
        setCur(id); seek(p.t.f, p.t.sent[i][2], true);
        markSentence({id:id,i:i,s:p.t.sent[i][2],e:p.t.sent[i][3]}); return; }
    }
    if(p.t) playPara(id, true);
  };
  $('#wordpanel').classList.add('on');
}
$('#wpclose').onclick=function(){ $('#wordpanel').classList.remove('on'); };
function onBookDblClick(e){
  var sel=String(window.getSelection()||'').trim();
  if(!sel || /\s/.test(sel)) return;

/* ---------------------------------------------------------------- selection bubble */
var bubble=$('#bubble'), selPara=-1, selText='';
function hideBubble(){ bubble.classList.remove('on'); }
function showBubble(){
  var sel=window.getSelection();
  if(!sel || sel.isCollapsed){ hideBubble(); return; }
  var t=String(sel).replace(/\s+/g,' ').trim();
  if(t.length<2){ hideBubble(); return; }
  var node=sel.anchorNode, el=node&&node.nodeType===1?node:node&&node.parentElement;
  while(el && el!==book && !/^p\d+$/.test(el.id||'')) el=el.parentElement;
  if(!el || el===book){ hideBubble(); return; }
  selPara=+el.id.slice(1); selText=t;
  $('#bWord').style.display = /\s/.test(t) ? 'none' : '';
  var r=sel.getRangeAt(0).getBoundingClientRect(), s=$('#stage').getBoundingClientRect();
  bubble.classList.add('on');
  var bw=bubble.offsetWidth||200;
  bubble.style.left=Math.min(Math.max(8, r.left-s.left+r.width/2-bw/2), s.width-bw-8)+'px';
  bubble.style.top=Math.max(4, r.top-s.top-bubble.offsetHeight-8)+'px';
}
document.addEventListener('selectionchange', function(){
  clearTimeout(showBubble._t); showBubble._t=setTimeout(showBubble, 90); });
// Re-anchor rather than hide: the bubble would otherwise vanish the moment playback starts and
// the page follows along, which is exactly when a reader wants to keep the line they just heard.
main.addEventListener('scroll', function(){
  if(!bubble.classList.contains('on') || showBubble._r) return;
  showBubble._r=requestAnimationFrame(function(){ showBubble._r=0; showBubble(); });
}, {passive:true});
$('#bMark').onclick=function(){ addMark(selPara, selText); window.getSelection().removeAllRanges(); hideBubble(); };
$('#bWord').onclick=function(){ showWord(selText); window.getSelection().removeAllRanges(); hideBubble(); };
$('#bPlay').onclick=function(){ playPara(selPara, true); window.getSelection().removeAllRanges(); hideBubble(); };

/* ---------------------------------------------------------------- search */
var IDX=null;
function buildIndex(){
  if(IDX) return IDX;
  IDX=[];
  for(var i=0;i<D.paras.length;i++){
    var t=plainOf(D.paras[i].id);
    if(t) IDX.push({id:D.paras[i].id, t:t, l:t.toLowerCase()});
  }
  return IDX;
}
function runSearch(){
  var q=$('#q').value.trim(), out=$('#qout'), hint=$('#qhint');
  if(q.length<2){ out.innerHTML=''; hint.textContent=q?'再多输入一个字':'按标题、人名或原句搜索全书。'; return; }
  var ix=buildIndex(), lq=q.toLowerCase(), hits=[], i;
  for(i=0;i<ix.length && hits.length<200;i++){
    var k=ix[i].l.indexOf(lq);
    if(k>=0) hits.push({id:ix[i].id, t:ix[i].t, k:k});
  }
  hint.textContent=hits.length ? (hits.length>=200?'200+ 处（只显示前 200 处）':hits.length+' 处') : '没有找到。';
  var h='';
  for(i=0;i<hits.length;i++){
    var s=hits[i], a=Math.max(0,s.k-64), b=Math.min(s.t.length, s.k+q.length+96);
    h+='<div class="hit" data-id="'+s.id+'"><div class="c">'+
       esc(nicecase(CH[chapterOf(s.id)]?CH[chapterOf(s.id)].title:''))+'</div><div class="s">'+
       (a>0?'…':'')+esc(s.t.slice(a,s.k))+'<mark>'+esc(s.t.substr(s.k,q.length))+'</mark>'+
       esc(s.t.slice(s.k+q.length,b))+(b<s.t.length?'…':'')+'</div></div>';
  }
  out.innerHTML=h;
  out.onclick=function(e){ var el=e.target.closest('.hit'); if(el){ jumpTo(+el.dataset.id); closeRail(); } };
}
$('#q').addEventListener('input', function(){ clearTimeout(runSearch._t); runSearch._t=setTimeout(runSearch,140); });
$('#q').addEventListener('keydown', function(e){ if(e.key==='Escape'){ this.value=''; runSearch(); this.blur(); } });

/* ---------------------------------------------------------------- chrome */
function tab(name){
  var m={toc:'#tabToc', find:'#tabFind', marks:'#tabMark', words:'#tabWord'};
  for(var k in m){ $(m[k]).setAttribute('aria-selected', String(k===name)); $('#'+k).hidden=(k!==name); }
  if(name==='find') setTimeout(function(){ $('#q').focus(); }, 30);
}
$('#tabToc').onclick=function(){ tab('toc') };
$('#tabFind').onclick=function(){ tab('find') };
$('#tabMark').onclick=function(){ tab('marks') };
$('#tabWord').onclick=function(){ tab('words') };

function openRail(){ rail.classList.add('on'); $('#scrim').classList.add('on'); }
function closeRail(){ rail.classList.remove('on');
  if(!document.querySelector('.sheet.on')) $('#scrim').classList.remove('on'); }
$('#railbtn').onclick=function(){ rail.classList.contains('on')?closeRail():openRail(); };
$('#scrim').onclick=function(){ closeRail(); closeSheets(); };
function openSheet(id){
  closeSheets(); $(id).classList.add('on'); $('#scrim').classList.add('on'); syncSheet(); }
function closeSheets(){
  var s=document.querySelectorAll('.sheet.on'), i;
  for(i=0;i<s.length;i++) s[i].classList.remove('on');
  if(!rail.classList.contains('on')) $('#scrim').classList.remove('on');
}
$('#settingsbtn').onclick=function(){ $('#sheet').classList.contains('on')?closeSheets():openSheet('#sheet'); };
$('#drill').onclick=function(){ $('#practice').classList.contains('on')?closeSheets():openSheet('#practice'); };

function wireSeg(id, key, cast){
  $(id).onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    var v=cast?cast(b.dataset.v):b.dataset.v;
    if(key==='sleep'){ setSleep(v); syncSheet(); return; }
    // E-ink panels are lower contrast and slower to refresh; a size the reader never chose is
    // worth nudging up once. Anything they set by hand is left alone.
    if(key==='theme' && v==='eink' && !P.sizeSet) P.size=Math.max(P.size, 21);
    P[key]=v; savePrefs();
    if(key==='sent'){ if(+v) reWrapVisible(); else clearSentences(); }
    if(key==='loop' || key==='times') loopLeft=+P.times;
  };
}
wireSeg('#segTheme','theme'); wireSeg('#segFont','font');
wireSeg('#segIndent','indent',Number); wireSeg('#segFollow','follow',Number);
wireSeg('#segSleep','sleep',Number); wireSeg('#segSent','sent',Number);
wireSeg('#segLoop','loop'); wireSeg('#segTimes','times',Number); wireSeg('#segGap','gap',Number);
function wireStep(id, key, step, lo, hi, round, after){
  $(id).onclick=function(e){
    var b=e.target.closest('button'); if(!b||!b.dataset.d) return;
    var v=P[key]+step*(+b.dataset.d);
    P[key]=Math.min(hi,Math.max(lo, round?Math.round(v*100)/100:v));
    if(after) after();
    savePrefs();
  };
}
wireStep('#stpSize','size',1,14,30,false,function(){ P.sizeSet=1; });
wireStep('#stpLead','lead',0.08,1.3,2.4,true);
wireStep('#stpWide','wide',2,24,52);
if(P.sleep) setSleep(P.sleep);
loopLeft=+P.times;

function clearSentences(){
  var sp=book.querySelectorAll('.sn'), i;
  for(i=0;i<sp.length;i++) sp[i].classList.remove('on');
}
function reWrapVisible(){ if(curId>=0) ensureWrapped(curId); wrapNear(); }

/* ---------------------------------------------------------------- keyboard */
document.addEventListener('keydown', function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  switch(e.key){
    case ' ': e.preventDefault(); $('#play').click(); break;
    case 'ArrowLeft':  e.preventDefault(); $('#back5').click(); break;
    case 'ArrowRight': e.preventDefault(); $('#fwd5').click(); break;
    case 'j': stepSent(1); break;
    case 'k': stepSent(-1); break;
    case 'r': $('#again').click(); break;
    case 'd': $('#drill').click(); break;
    case 'm': if(curId>=0) addMark(curId, txt(D.paras[curId].html)); break;
    case 'w': var s=String(window.getSelection()||'').trim(); if(s) showWord(s); break;
    case '/': e.preventDefault(); openRail(); tab('find'); break;
    case 't': openRail(); tab('toc'); break;
    case 'Escape': closeRail(); closeSheets(); hideBubble();
                   $('#wordpanel').classList.remove('on'); break;
  }
});
</script>
</body></html>

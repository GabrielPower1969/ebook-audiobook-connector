<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader</title>
<style>
:root{--bg:#faf7f2;--fg:#2b2620;--muted:#8a8078;--acc:#c2511f;--hl:#fff1c9;--side:#f1ece4;--line:#e3dcd2}
@media(prefers-color-scheme:dark){:root{--bg:#1b1917;--fg:#e8e2d9;--muted:#8f877d;--acc:#f08a55;--hl:#3a3222;--side:#211e1b;--line:#33302b}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px/1.7 Georgia,"Times New Roman",serif}
#app{display:grid;grid-template-columns:260px 1fr;height:100vh}#toc,#main{height:100vh;min-height:0}body{overflow:hidden}
#toc{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:16px 0;font:14px/1.5 -apple-system,system-ui,sans-serif}
#toc h1{font-size:15px;margin:0 16px 12px;letter-spacing:.04em}#toc a.back{color:var(--muted);font-size:13px;margin-bottom:6px}
#toc a{display:block;padding:6px 16px;color:var(--fg);text-decoration:none;opacity:.85;cursor:pointer}
#toc a:hover,#toc a.cur{background:var(--hl);opacity:1}
#toc a.na{opacity:.4}
#main{overflow-y:auto;padding:40px 8vw 160px;position:relative}
#book{max-width:720px;margin:0 auto}
#book p,#book h1,#book h2,#book h3{margin:0 0 1em;padding:6px 10px;border-radius:6px;position:relative}
#book h1{font-size:1.7em;margin-top:2.5em}#book h2{font-size:1.25em;margin-top:2em}#book h3{font-size:1.05em}
#book .al{cursor:pointer;border-left:3px solid transparent}
#book .al:hover{background:var(--side)}
#book .cur{background:var(--hl);border-left-color:var(--acc)}
#book .al::before{content:attr(data-time);position:absolute;left:-84px;top:8px;width:72px;text-align:right;font:12px system-ui;color:var(--muted);opacity:0}
#book .al:hover::before,#book .cur::before{opacity:1}
#book .na{opacity:.55}
#player{position:fixed;left:260px;right:0;bottom:0;background:var(--side);border-top:1px solid var(--line);padding:12px 24px;font:14px system-ui,sans-serif;display:flex;flex-direction:column;gap:8px}
#bar{height:6px;background:var(--line);border-radius:3px;cursor:pointer;position:relative}
#bar>div{height:100%;background:var(--acc);border-radius:3px;width:0}
#ctl{display:flex;align-items:center;gap:14px}
button{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-size:16px;padding:6px 18px}
#now{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px}
label{display:flex;gap:6px;align-items:center;color:var(--muted)}
#user{color:var(--muted);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
@media(max-width:800px){#app{grid-template-columns:1fr}#toc{display:none;position:fixed;top:0;left:0;bottom:0;width:min(80vw,320px);z-index:5;box-shadow:4px 0 24px rgba(0,0,0,.25)}#toc.open{display:block}#player{left:0}#main{padding:20px 16px 160px}#book .al::before{display:none}#menu{display:inline-block}}
</style></head><body>
<div id="app">
 <nav id="toc"></nav>
 <div id="main"><div id="book"></div></div>
</div>
<div id="player">
 <div id="bar"><div></div></div>
 <div id="ctl">
  <button id="menu" title="目录">☰</button>
  <button id="prev" title="上一段">⏮</button>
  <button id="play" class="pri">▶</button>
  <button id="next" title="下一段">⏭</button>
  <button id="back" title="后退 10 秒">−10s</button>
  <span id="now">—</span>
  <label>速度 <select id="rate"><option>0.8</option><option selected>1</option><option>1.2</option><option>1.5</option><option>1.8</option><option>2</option></select></label>
  <label><input type="checkbox" id="follow" checked> 跟随滚动</label>
  <span id="user" title="登录身份"></span>
 </div>
</div>
<audio id="a" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s);
const a=$('#a'),book=$('#book'),toc=$('#toc'),main=$('#main');
let D,seq=[],curIdx=-1,curFile=-1,TOPTAG='h1';
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
const SLUG=new URLSearchParams(location.search).get('book');const BASE=SLUG+'/';
const POSKEY='pos:'+SLUG;
let ME={user:'local',auth:'local'},serverPos=null,lastSave=0;
Promise.all([
  fetch(BASE+'data.json').then(r=>r.json()),
  fetch('api/me').then(r=>r.ok?r.json():ME).catch(()=>ME),
  fetch('api/progress/'+encodeURIComponent(SLUG)).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([d,me,pos])=>{D=d;ME=me;serverPos=pos&&pos.ts?pos:null;document.title=d.title;
  $('#user').textContent=me.auth==='cloudflare'?me.user:'';render();restore();});
function savePos(force){
  if(curIdx<0||curFile<0)return;
  const rec={id:curIdx,f:curFile,t:a.currentTime,ts:Date.now()};
  localStorage.setItem(POSKEY,JSON.stringify(rec));
  if(ME.auth!=='cloudflare')return;
  const now=Date.now();if(!force&&now-lastSave<5000)return;lastSave=now;
  const body=JSON.stringify(rec),url='api/progress/'+encodeURIComponent(SLUG);
  if(force&&navigator.sendBeacon)navigator.sendBeacon(url,new Blob([body],{type:'application/json'}));
  else fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{});
}
addEventListener('pagehide',()=>savePos(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos(true)});
function render(){
  const frag=document.createDocumentFragment();
  toc.innerHTML='<a href="index.html" class="back">‹ 书架</a><h1></h1>';toc.querySelector('h1').textContent=D.title;
  const TOP=TOPTAG=['h1','h2','h3'].find(t=>D.paras.some(p=>p.tag===t))||'h1';
  for(const p of D.paras){
    const el=document.createElement(p.tag);el.innerHTML=p.html;el.id='p'+p.id;
    if(p.t){el.className='al';el.dataset.time=fmt(p.t.s);el.onclick=()=>playPara(p.id);}
    else el.className='na';
    frag.appendChild(el);
    if(p.tag===TOP){const l=document.createElement('a');l.textContent=el.textContent;l.className=p.t?'':'na';l.onclick=()=>{main.scrollTop=el.offsetTop-24;toc.classList.remove('open');};l.dataset.p=p.id;toc.appendChild(l);}
  }
  book.appendChild(frag);
  seq=D.paras.filter(p=>p.t).sort((x,y)=>x.t.f-y.t.f||x.t.s-y.t.s);
}
function playPara(id){
  const p=D.paras[id];if(!p.t)return;
  seek(p.t.f,p.t.s,true);setCur(id);
}
function seek(f,t,play){
  const go=()=>{a.currentTime=t;if(play)a.play();};
  if(curFile!==f||!a.src){curFile=f;a.src=BASE+'audio/'+encodeURIComponent(D.files[f]);a.addEventListener('loadedmetadata',go,{once:true});}
  else go();
}
function setCur(id){
  if(id===curIdx)return;
  document.querySelectorAll('#book .cur').forEach(e=>e.classList.remove('cur'));
  curIdx=id;const el=document.getElementById('p'+id);
  if(el){el.classList.add('cur');keepVisible(el);}
  const p=D.paras[id];let ch=null;for(let i=id;i>=0;i--)if(D.paras[i].tag===TOPTAG){ch=D.paras[i].id;break;}
  toc.querySelectorAll('a').forEach(x=>x.classList.toggle('cur',+x.dataset.p===ch));
}
function keepVisible(el){
  if(!$('#follow').checked)return;
  requestAnimationFrame(()=>{const r=el.getBoundingClientRect(),h=main.clientHeight;
    if(r.top<80||r.bottom>h-180)main.scrollTop=el.offsetTop-h/2+el.offsetHeight/2;});
}
function locate(f,t){ // last para in seq with same file and s<=t
  let lo=0,hi=seq.length-1,ans=-1;
  while(lo<=hi){const m=(lo+hi)>>1,p=seq[m].t;if(p.f<f||(p.f===f&&p.s<=t)){ans=m;lo=m+1;}else hi=m-1;}
  return ans>=0&&seq[ans].t.f===f?seq[ans]:null;
}
a.ontimeupdate=()=>{
  if(!D||curFile<0)return;
  const p=locate(curFile,a.currentTime);if(p)setCur(p.id);
  if(curIdx>=0){const el=document.getElementById('p'+curIdx);if(el)keepVisible(el);}
  savePos(false);
  $('#bar>div').style.width=(a.currentTime/a.duration*100||0)+'%';
  $('#now').textContent=`Part ${curFile+1}/${D.files.length} · ${fmt(a.currentTime)} / ${fmt(a.duration||0)}`;
};
a.onplay=()=>$('#play').textContent='❚❚';a.onpause=()=>{$('#play').textContent='▶';savePos(true);};
a.onended=()=>{const n=seq.find(p=>p.t.f===curFile+1);if(n)playPara(n.id);};
$('#play').onclick=()=>{if(curFile<0){if(seq.length)playPara(seq[0].id);return;}a.paused?a.play():a.pause();};
const step=k=>{const i=seq.findIndex(p=>p.id===curIdx);const n=seq[i+k];if(n)playPara(n.id);};
$('#menu').onclick=()=>toc.classList.toggle('open');
main.addEventListener('click',()=>toc.classList.remove('open'));
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#back').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-10)};
$('#rate').onchange=e=>a.playbackRate=+e.target.value;
$('#bar').onclick=e=>{if(a.duration)a.currentTime=e.offsetX/e.currentTarget.clientWidth*a.duration};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();$('#play').click();}
  else if(e.key==='ArrowLeft')$('#back').click();else if(e.key==='ArrowRight')a.currentTime+=10;
  else if(e.key==='j')step(1);else if(e.key==='k')step(-1);});
function restore(){
  try{let s=null;try{s=JSON.parse(localStorage.getItem(POSKEY))}catch(e){}
    if(serverPos&&(!s||(serverPos.ts||0)*1000>(s.ts||0)))s=serverPos;   // server ts is in seconds
    if(!s)return;
    seek(s.f,s.t,false);setCur(s.id);
    const el=document.getElementById('p'+s.id);if(el)setTimeout(()=>main.scrollTop=el.offsetTop-main.clientHeight/2,50);
  }catch(e){}
}
</script></body></html>
